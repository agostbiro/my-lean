name = "my-lean"
version = "0.1.0"
defaultTargets = ["TheoryOfComputation", "FunctionalProgramming", "Misc"]

# Run `lake lint` to lint all libraries with Batteries.
lintDriver = "batteries/runLinter"

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.32.0"

# Mathlib v4.32.0 pins the same Batteries revision as the require above, so the
# two dependencies agree. `TheoryOfComputation` uses its `DFA` / `Language` API,
# and `Misc` uses its number theory API.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.0"

[[lean_lib]]
name = "TheoryOfComputation"
srcDir = "theory-of-computation"

[[lean_lib]]
name = "FunctionalProgramming"
srcDir = "functional-programming"

[[lean_lib]]
name = "Misc"
srcDir = "misc"
